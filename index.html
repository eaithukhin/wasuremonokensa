<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>忘れ物検索アプリ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',sans-serif;background:#f0f7f0;color:#1a1a1a;}
.header{background:#27a866;color:white;padding:1rem;text-align:center;}
.header h1{font-size:1.3rem;}
.header p{font-size:0.8rem;opacity:0.8;margin-top:3px;}
.nav{display:flex;background:white;border-bottom:2px solid #e0f0e0;position:sticky;top:0;z-index:100;}
.nav-btn{flex:1;padding:0.8rem;border:none;background:none;font-size:0.85rem;color:#666;cursor:pointer;border-bottom:3px solid transparent;}
.nav-btn.active{color:#27a866;border-bottom-color:#27a866;font-weight:600;}
.page{display:none;padding:1rem;min-height:calc(100vh - 120px);}
.page.active{display:block;}
.card{background:white;border-radius:12px;padding:1rem;margin-bottom:1rem;border:1px solid #e0f0e0;}
.card h3{color:#145c33;margin-bottom:1rem;}
.btn{width:100%;padding:0.9rem;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;margin-bottom:0.6rem;}
.btn-green{background:#27a866;color:white;}
.btn-outline{background:white;color:#27a866;border:2px solid #27a866;}
input[type="text"]{width:100%;padding:0.8rem;border:1.5px solid #cde8cd;border-radius:8px;font-size:1rem;margin-bottom:0.8rem;outline:none;}
input[type="text"]:focus{border-color:#27a866;}
.item-card{background:white;border-radius:12px;padding:1rem;margin-bottom:0.8rem;border:1px solid #e0f0e0;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
.item-name{font-weight:600;font-size:1rem;}
.item-meta{font-size:0.75rem;color:#666;margin-top:3px;}
.badge{display:inline-block;background:#eaf3de;color:#3b6d11;font-size:0.7rem;padding:2px 8px;border-radius:999px;font-weight:500;margin-top:4px;}
.status{padding:0.7rem 1rem;border-radius:8px;margin-bottom:1rem;font-size:0.9rem;display:none;}
.status.success{background:#eaf3de;color:#3b6d11;display:block;}
.status.error{background:#fcebeb;color:#a32d2d;display:block;}
.gps-info{background:#eaf3de;border-radius:8px;padding:0.7rem;font-size:0.85rem;color:#3b6d11;margin-bottom:0.8rem;display:none;}
.barcode-result{background:#f0f7f0;border-radius:8px;padding:0.7rem;font-size:0.85rem;color:#145c33;margin-bottom:0.8rem;display:none;font-family:monospace;}
.empty-state{text-align:center;padding:3rem 1rem;color:#999;}
.empty-state .emoji{font-size:3rem;margin-bottom:1rem;}
#map{height:300px;border-radius:12px;margin-bottom:1rem;}
.search-bar{display:flex;gap:8px;margin-bottom:1rem;}
.search-bar input{margin-bottom:0;flex:1;}
</style>
</head>
<body>

<div class="header">
  <h1>🔍 忘れ物検索アプリ</h1>
  <p>大切なものをなくさないために</p>
</div>

<nav class="nav">
  <button class="nav-btn active" onclick="showPage('list',this)">📋 一覧</button>
  <button class="nav-btn" onclick="showPage('register',this)">➕ 登録</button>
  <button class="nav-btn" onclick="showPage('map',this)">🗺️ 地図</button>
</nav>

<!-- LIST -->
<div id="page-list" class="page active">
  <div class="search-bar">
    <input type="text" id="search-input" placeholder="🔍 アイテムを検索..." oninput="searchItems()">
  </div>
  <div id="items-container"><div class="empty-state"><div class="emoji">⏳</div><p>読み込み中...</p></div></div>
</div>

<!-- REGISTER -->
<div id="page-register" class="page">
  <div class="card">
    <h3>📦 新しいアイテムを登録</h3>
    <div id="status-msg" class="status"></div>
    <input type="text" id="item-name" placeholder="アイテム名（例：家の鍵、財布）">
    <div id="barcode-result" class="barcode-result">📊 バーコード: <span id="barcode-value"></span></div>
    <button class="btn btn-outline" onclick="startScanner()">📷 バーコードをスキャン</button>
    <div id="scanner-container" style="margin-bottom:0.8rem;"></div>
    <div id="gps-info" class="gps-info">📍 GPS取得済み: <span id="gps-coords"></span></div>
    <button class="btn btn-outline" onclick="getLocation()">📍 現在地を取得</button>
    <button class="btn btn-green" onclick="saveItem()">💾 登録する</button>
  </div>
</div>

<!-- MAP -->
<div id="page-map" class="page">
  <div class="card">
    <h3>🗺️ アイテムの最終位置</h3>
    <div id="map"></div>
    <div id="map-items-list"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyAtvS4lA_JnADba0VT-HzHjsNHrRTiOk_c",
  authDomain: "wasuremonokensa.firebaseapp.com",
  projectId: "wasuremonokensa",
  storageBucket: "wasuremonokensa.firebasestorage.app",
  messagingSenderId: "383050893909",
  appId: "1:383050893909:web:bec44cce175954483622dc"
});
const db = firebase.firestore();

let currentLat = null, currentLng = null, currentBarcode = null;
let scanner = null, allItems = [], map = null, markers = [];

function showPage(page, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  btn.classList.add('active');
  if (page === 'map') initMap();
  if (scanner && page !== 'register') scanner.stop().catch(() => {});
}

function loadItems() {
  db.collection('items').orderBy('timestamp','desc').onSnapshot(snap => {
    allItems = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderItems(allItems);
  });
}

function renderItems(items) {
  const c = document.getElementById('items-container');
  if (!items.length) {
    c.innerHTML = `<div class="empty-state"><div class="emoji">📦</div><p>アイテムがありません</p><p style="font-size:0.8rem;margin-top:0.5rem;">「登録」タブから追加してください</p></div>`;
    return;
  }
  c.innerHTML = items.map(item => `
    <div class="item-card" onclick="openInMaps(${item.lat},${item.lng})">
      <div>
        <div class="item-name">${item.name}</div>
        <div class="item-meta">📊 ${item.barcode || 'バーコードなし'}</div>
        <div class="item-meta">📅 ${item.timestamp ? new Date(item.timestamp.seconds*1000).toLocaleString('ja-JP') : '—'}</div>
        ${item.lat ? '<span class="badge">📍 GPS記録済み</span>' : ''}
      </div>
      <div style="text-align:center;">
        <div style="font-size:1.5rem;">🗺️</div>
        <button onclick="event.stopPropagation();deleteItem('${item.id}')" style="border:none;background:none;color:#e24b4a;cursor:pointer;font-size:0.75rem;margin-top:4px;">削除</button>
      </div>
    </div>`).join('');
}

function searchItems() {
  const q = document.getElementById('search-input').value.toLowerCase();
  renderItems(allItems.filter(i => i.name.toLowerCase().includes(q) || (i.barcode && i.barcode.includes(q))));
}

function getLocation() {
  showStatus('GPS取得中...', 'success');
  navigator.geolocation.getCurrentPosition(
    pos => {
      currentLat = pos.coords.latitude;
      currentLng = pos.coords.longitude;
      document.getElementById('gps-info').style.display = 'block';
      document.getElementById('gps-coords').textContent = `${currentLat.toFixed(5)}, ${currentLng.toFixed(5)}`;
      showStatus('現在地を取得しました！', 'success');
    },
    () => showStatus('GPS取得に失敗しました。位置情報の許可を確認してください。', 'error')
  );
}

function startScanner() {
  const container = document.getElementById('scanner-container');
  container.innerHTML = '<div id="qr-reader"></div>';
  if (scanner) scanner.stop().catch(() => {});
  scanner = new Html5Qrcode("qr-reader");
  scanner.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 250, height: 150 } },
    text => {
      currentBarcode = text;
      document.getElementById('barcode-result').style.display = 'block';
      document.getElementById('barcode-value').textContent = text;
      scanner.stop();
      container.innerHTML = '';
      showStatus('バーコードを読み取りました！', 'success');
    },
    () => {}
  ).catch(() => {
    showStatus('カメラのアクセスを許可してください', 'error');
    container.innerHTML = '';
  });
}

async function saveItem() {
  const name = document.getElementById('item-name').value.trim();
  if (!name) { showStatus('アイテム名を入力してください', 'error'); return; }
  if (!currentLat) { showStatus('現在地を取得してください', 'error'); return; }
  try {
    await db.collection('items').add({
      name, barcode: currentBarcode || null,
      lat: currentLat, lng: currentLng,
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    });
    showStatus(`「${name}」を登録しました！`, 'success');
    document.getElementById('item-name').value = '';
    document.getElementById('barcode-result').style.display = 'none';
    document.getElementById('gps-info').style.display = 'none';
    currentBarcode = null; currentLat = null; currentLng = null;
  } catch(e) { showStatus('登録に失敗しました: ' + e.message, 'error'); }
}

async function deleteItem(id) {
  if (confirm('このアイテムを削除しますか？')) await db.collection('items').doc(id).delete();
}

function openInMaps(lat, lng) {
  if (!lat || !lng) { alert('GPS情報がありません'); return; }
  window.open(`https://www.google.com/maps?q=${lat},${lng}`, '_blank');
}

function initMap() {
  if (!map) {
    map = L.map('map').setView([35.6762, 139.6503], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);
  }
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  const withGPS = allItems.filter(i => i.lat && i.lng);
  if (!withGPS.length) {
    document.getElementById('map-items-list').innerHTML = '<p style="color:#666;font-size:0.85rem;">GPS情報のあるアイテムがありません</p>';
    return;
  }
  withGPS.forEach(item => {
    const m = L.marker([item.lat, item.lng]).addTo(map).bindPopup(`<b>${item.name}</b>`);
    markers.push(m);
  });
  map.setView([withGPS[0].lat, withGPS[0].lng], 14);
  document.getElementById('map-items-list').innerHTML = withGPS.map(item => `
    <div class="item-card" onclick="map.setView([${item.lat},${item.lng}],16)">
      <div>
        <div class="item-name">${item.name}</div>
        <div class="item-meta">${item.lat.toFixed(4)}, ${item.lng.toFixed(4)}</div>
      </div>
      <button onclick="event.stopPropagation();openInMaps(${item.lat},${item.lng})"
        style="border:1.5px solid #27a866;background:white;color:#27a866;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:0.8rem;">
        Googleマップ
      </button>
    </div>`).join('');
  setTimeout(() => map.invalidateSize(), 100);
}

function showStatus(msg, type) {
  const el = document.getElementById('status-msg');
  el.textContent = msg; el.className = 'status ' + type;
  setTimeout(() => el.className = 'status', 4000);
}

loadItems();
</script>
</body>
</html>
